name: Construir frota.grf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  grf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar NML e Pillow
        run: pip install nml pillow
      - name: Montar e compilar
        run: ./construir.sh
      - name: Publicar o .grf
        uses: actions/upload-artifact@v4
        with:
          name: frota-grf
          path: build/frota.grf
